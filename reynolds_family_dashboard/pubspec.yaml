name: reynolds_family_dashboard
description: Reynolds Family Dashboard for iPad
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    # Seeded mock data shaped like the household's SHOPPING.md. Development never reads or
    # writes the live household files (AGENTS.md); live wiring is Phase 5.
    - assets/fixtures/shopping_seed.md
